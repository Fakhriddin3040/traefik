services:
  traefik:
    image: traefik:3.7.16
    container_name: traefik

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "8088:8080"

    expose:
      - "8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
      - ./acme-zerossl.json:/acme-zerossl.json
      - ./dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped

    command:
      - "--entrypoints.websecure.address=:443"

networks:
  default:
    name: traefik
    external: true
