api:
  insecure: true
  dashboard: true

log:
  level: INFO

providers:
  docker:
    exposedByDefault: false
    network: traefik
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "murodjonfaiziev@gmail.com"
      storage: "/acme.json"
      httpChallenge:
        entryPoint: "web"

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"

  websecure:
    address: ":443"

